name: Release
# the run is titled with just the version, not the commit message
run-name: ${{ github.event.inputs.tag || github.ref_name }}

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, like v1.1.1'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event_name == 'push' && github.ref_name || (startsWith(github.event.inputs.tag, 'v') && github.event.inputs.tag || format('v{0}', github.event.inputs.tag)) }}

jobs:
  android-desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build
        run: ./gradlew desktop:release android:assembleRelease --no-daemon

      - name: Sign apk
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          VERSION="${TAG#v}"
          mkdir -p dist
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=$(ls android/build/outputs/apk/release/*.apk | head -1)

          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.jks
            STORE_PASS="$KEYSTORE_PASS"
            ALIAS_PASS="${KEY_PASS:-$KEYSTORE_PASS}"
            ALIAS=$(keytool -list -keystore release.jks -storepass "$STORE_PASS" 2>&1 | awk -F', ' '/PrivateKeyEntry/{print $1; exit}')
            if [ -z "$ALIAS" ]; then
              echo "no key in the keystore, wrong password?"
              exit 1
            fi
          else
            echo "no keystore secret set, signing with a temporary key"
            STORE_PASS=orange-temp
            ALIAS=orange
            ALIAS_PASS=orange-temp
            keytool -genkeypair -keystore release.jks -storepass "$STORE_PASS" -keypass "$ALIAS_PASS" \
              -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Orange Pixel Dungeon"
          fi

          OUT="dist/OrangePixelDungeon-v${VERSION}-Android.apk"
          "$BT/zipalign" -f -p 4 "$APK" aligned.apk
          "$BT/apksigner" sign --ks release.jks --ks-pass "pass:$STORE_PASS" --key-pass "pass:$ALIAS_PASS" \
            --ks-key-alias "$ALIAS" --out "$OUT" aligned.apk
          "$BT/apksigner" verify "$OUT"

          cp desktop/build/libs/desktop-*.jar "dist/OrangePixelDungeon-v${VERSION}-Desktop.jar"

      - uses: actions/upload-artifact@v4
        with:
          name: release-android-desktop
          path: dist/*
          if-no-files-found: error

  ios:
    runs-on: macos-15-intel
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build ipa
        run: ./gradlew ios:createIPA --no-daemon -Probovm.iosSkipSigning=true

      - name: Copy ipa
        run: |
          VERSION="${TAG#v}"
          mkdir -p dist
          cp "$(find ios/build -name '*.ipa' | head -1)" "dist/OrangePixelDungeon-v${VERSION}-iOS-unsigned.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: release-ios
          path: dist/*.ipa
          if-no-files-found: error

  publish:
    needs: [android-desktop, ios]
    if: ${{ !cancelled() && needs.android-desktop.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Orange Pixel Dungeon ${{ env.TAG }}
          body_path: docs/releases/${{ env.TAG }}.md
          files: dist/*
          fail_on_unmatched_files: true
