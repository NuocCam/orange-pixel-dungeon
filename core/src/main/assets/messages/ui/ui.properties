###orange changelog
ui.changelist.orange_v1_x_changes.v122_skull_chalice_title=Skull Chalice
ui.changelist.orange_v1_x_changes.v122_skull_chalice_text=The Skull Chalice now brings Ijiraq to you much more often.\n\nIts description now tells you what each level does.
ui.changelist.orange_v1_x_changes.v122_amber_eyes_title=Amber Eyes
ui.changelist.orange_v1_x_changes.v122_amber_eyes_text=Normal boars and dire wolves now have amber eyes, so a disguised Ijiraq is easyer to spot.
ui.changelist.orange_v1_x_changes.v121_masterwork_title=Masterwork
ui.changelist.orange_v1_x_changes.v121_masterwork_text=The Troll Blacksmith can now rework a weapon or armor for 3000 favor.
ui.changelist.orange_v1_x_changes.v121_skull_chalice_title=Skull Chalice
ui.changelist.orange_v1_x_changes.v121_skull_chalice_text=A new trinket. Something is looking for whoever drinks from it.
ui.changelist.orange_v1_x_changes.v121_magic_wells_title=Magic Wells
ui.changelist.orange_v1_x_changes.v121_magic_wells_text=2 new magic wells: electricity and enchantment.
ui.changelist.orange_v1_x_changes.v121_ring_of_wealth_title=Ring of Wealth
ui.changelist.orange_v1_x_changes.v121_ring_of_wealth_text=The Ring of Wealth now has a limit of bonus drops per floor, and its gear is at most +4 (Ascendant Citrine too).
ui.changelist.orange_v1_x_changes.v121_spellbook_title=Unstable Spellbook
ui.changelist.orange_v1_x_changes.v121_spellbook_text=The Unstable Spellbook now lets you pick 1 of 2 scrolls, and any missing scroll can upgrade it.
ui.changelist.orange_v1_x_changes.v121_crossbow_title=Crossbow
ui.changelist.orange_v1_x_changes.v121_crossbow_text=Darts shot from an upgraded crossbow have a sligtly lower max damage.
ui.changelist.orange_v1_x_changes.v121_runic_blade_title=Runic Blade
ui.changelist.orange_v1_x_changes.v121_runic_blade_text=The Duelist's Runic Blade ability grows a bit slower with upgrades.
ui.changelist.orange_v1_x_changes.v121_well_of_awareness_title=Well of Awareness
ui.changelist.orange_v1_x_changes.v121_well_of_awareness_text=The Well of Awareness no longer shows items on the floor, but it may indentify items in your bag.
ui.changelist.orange_v1_x_changes.v121_bugfixes_text=Fixed the following bugs:\n**-** A disguised Ijiraq could flaten grass when the thing it copied wouldn't
ui.changelist.orange_v1_x_changes.v120_developer_commentary_title=Developer Commentary
ui.changelist.orange_v1_x_changes.v120_developer_commentary_text=I always wanted to have more variaties of floors and more items to play with, this is a big update so there may be bugs that im not aware of
ui.changelist.orange_v1_x_changes.v120_jungle_floors_title=Jungle Floors
ui.changelist.orange_v1_x_changes.v120_jungle_floors_text=Jungle floors, the sewers alternative.
ui.changelist.orange_v1_x_changes.v120_monsters_quests_title=Monsters & Quests
ui.changelist.orange_v1_x_changes.v120_monsters_quests_text=New monsters and quests.
ui.changelist.orange_v1_x_changes.v120_amalgam_title=Amalgam
ui.changelist.orange_v1_x_changes.v120_amalgam_text=Amalgam, a new boss for floor 5.
ui.changelist.orange_v1_x_changes.v120_puzzle_rooms_badges_title=Puzzle Rooms & Badges
ui.changelist.orange_v1_x_changes.v120_puzzle_rooms_badges_text=New puzzle rooms and 7 new badges.
ui.changelist.orange_v1_x_changes.v120_new_consumables_title=New Consumables
ui.changelist.orange_v1_x_changes.v120_new_consumables_text=New consumables.
ui.changelist.orange_v1_x_changes.v120_magic_orange_title=Magic Orange
ui.changelist.orange_v1_x_changes.v120_magic_orange_text=A rare snack that heals a bit.
ui.changelist.orange_v1_x_changes.v120_ijiraq_title=Ijiraq
ui.changelist.orange_v1_x_changes.v120_ijiraq_text=A shapeshifter with red eyes. Becareful!
ui.changelist.orange_v1_x_changes.v120_cape_of_thorns_title=Cape of Thorns
ui.changelist.orange_v1_x_changes.v120_cape_of_thorns_text=The Cape of Thorns now waits until you use it, and levels up easier.
ui.changelist.orange_v1_x_changes.v120_ghost_lore_title=Ghost Lore
ui.changelist.orange_v1_x_changes.v120_ghost_lore_text=Changed ghost lore.
ui.changelist.orange_v1_x_changes.v120_medic_kit_title=Medic Kit
ui.changelist.orange_v1_x_changes.v120_medic_kit_text=The Medic Kit now opens the Potion Bandolier by default when you add a Potion of Healing, if you have it.
ui.changelist.orange_v1_x_changes.v120_ijiraq_drops_title=Ijiraq Drops
ui.changelist.orange_v1_x_changes.v120_ijiraq_drops_text=Added Ijiraq drops.
ui.changelist.orange_v1_x_changes.v120_bugfixes_text=Fixed the following bugs:\n**-** Ascendant Citrine from a Scroll of Transmutation stayed weak until rerolled\n**-** Ascendant Citrine was hiding the Spirit Form ring of the same kind\n**-** Update changes showing in the wrong section of others\n**-** Fixes Ascendant Citrine description showing wrong numbers
ui.changelist.orange_v1_x_changes.v112_ascendant_citrine_title=Ascendant Citrine
ui.changelist.orange_v1_x_changes.v112_ascendant_citrine_text=The new **Ascendant Citrine** artifact carries the echo of a random ring, at a third of its strength. Ring of Force isn't in the pool.\n\n**-** It only charges when you level up. Ring of Energy and Light Cloak help, timed recharging does nothing\n**-** A charge rerolls it into a different ring, never the same one twice in a row\n**-** Each reroll also upgrades it up to +10, and it scales like a ring of that level\n**-** Stacks with worn rings of the same kind\n**-** Strength, thrown weapon damge and bonus drops only count whole points\n**-** A cursed one does nothing, and you can't put on rings while wearing it
ui.changelist.orange_v1_x_changes.v112_title_screen_icons_title=Title Screen & Icons
ui.changelist.orange_v1_x_changes.v112_title_screen_icons_text=**-** The flames on the title screen are now spinning oranges\n**-** Boss Slain and Game Over use the orange colors too\n**-** The app icon is orange now on every platform\n**-** Fixed the iOS launch screen still showing the Shattered logo
ui.changelist.orange_v1_x_changes.v111_bugfixes_text=Fixed the following bugs:\n**-** The Medic Kit description showing raw formatting codes and logging an error\n**-** The Spyglass being unidentified after the Cracked Spyglass repairs itself\n**-** The Talisman of Foresight showing a missing text message when a hidden item is close by
ui.changelist.orange_v1_x_changes.v111_medic_kit_title=Medic Kit
ui.changelist.orange_v1_x_changes.v111_medic_kit_text=**-** The Medic Kit now shows its charges with the maximum, like 2/5\n**-** Healing to full health now uses only as many charges as it takes, taking the Vial of Blood's bonus into account, and at +6 anything the healing can't use still becomes a shield\n**-** Healing from the kit is now spread out by the Vial of Blood like other healing, including the instant heal at +10
ui.changelist.orange_v1_x_changes.v111_beacon_of_returning_title=Beacon of Returning
ui.changelist.orange_v1_x_changes.v111_beacon_of_returning_text=The Beacon of Returning spell has been removed from alchemy. Lloyd's Beacon can still be used to set a return point.
ui.changelist.orange_v1_x_changes.v110_orange_versions_changelog_title=Orange Versions & Changelog
ui.changelist.orange_v1_x_changes.v110_orange_versions_changelog_text=Orange Pixel Dungeon now has its own version number, starting at v1.0.\n\nThis screen lists everything Orange changes compared to the original Shattered Pixel Dungeon v4.0.2, split into New, Changes, Buffs and Nerfs for each Orange version. The original game's changelogs are still available with the other buttons below.
ui.changelist.orange_v1_x_changes.v110_spyglass_title=Spyglass
ui.changelist.orange_v1_x_changes.v110_spyglass_text=A new trinket that cannot be found in the dungeon. It is what a Cracked Spyglass becomes once its lens is repaired, see the Cracked Spyglass entry under Changes.
ui.changelist.orange_v1_x_changes.v110_mossy_clump_title=Mossy Clump
ui.changelist.orange_v1_x_changes.v110_mossy_clump_text=The Mossy Clump has been reworked. It no longer turns floors into grass or water themed floors, and instead:\n\n**-** Always fills each floor with patches of grass and random plants, half helpful and half harmful. 4 plants at +0, and 2 more per level.\n**-** Whenever a plant is trampled by anyone, a new random plant regrows somewhere else on the floor, which can be helpful or harmful.\n**-** Every helpful plant trampled on a floor makes regrowing plants there 5% less likely to be helpful, until they are all harmful. This only affects that floor.\n\nUpgrade cost is unchanged.
ui.changelist.orange_v1_x_changes.v110_dimensional_sundial_title=Dimensional Sundial
ui.changelist.orange_v1_x_changes.v110_dimensional_sundial_text=The Dimensional Sundial no longer changes how quickly enemies spawn. Instead it changes enemies based on the real-life time of day:\n\n**-** At night (8pm-8am): enemies have 5-15% less health, but deal 0-10% more damage\n**-** During the day (8am-8pm): enemies deal 5-15% less damage, but have 0-10% more health\n\nThe effect scales with the trinket's level. Health is set when an enemy spawns, and bosses are not affected by the health change.
ui.changelist.orange_v1_x_changes.v110_cracked_spyglass_title=Cracked Spyglass
ui.changelist.orange_v1_x_changes.v110_cracked_spyglass_text=The Cracked Spyglass now keeps track of how many of its hidden items you have picked up. After 10, the lens is repaired and the trinket becomes a **Spyglass**, which keeps its level and still creates extra items on each floor, but the items are no longer hidden.
ui.changelist.orange_v1_x_changes.v110_talisman_of_foresight_title=Talisman of Foresight
ui.changelist.orange_v1_x_changes.v110_talisman_of_foresight_text=The talisman now also warns you when an item hidden by the Cracked Spyglass is close by, just like it does for hidden traps.
ui.changelist.orange_v1_x_changes.v110_about_screen_title=About Screen
ui.changelist.orange_v1_x_changes.v110_about_screen_text=The about screen now credits the developer of Orange Pixel Dungeon, with a link to their GitHub page. Shattered Pixel Dungeon and everyone else involved is still credited below.
ui.changelist.orange_v1_x_changes.v110_earthen_guardian_title=Earthen Guardian
ui.changelist.orange_v1_x_changes.v110_earthen_guardian_text=The guardian created by the Wand of Living Earth is sturdier:\n\n**-** Armor increased by 1, plus 1 more every 2 wand levels\n**-** Takes 20% less damage from magical sources
ui.changelist.orange_v1_x_changes.v110_parchment_scrap_title=Parchment Scrap
ui.changelist.orange_v1_x_changes.v110_parchment_scrap_text=Weapon enchantments and armor glyphs you own are now 5-15% stronger while you carry the Parchment Scrap, depending on its level.
ui.changelist.orange_v1_x_changes.v110_dried_rose_title=Dried Rose
ui.changelist.orange_v1_x_changes.v110_dried_rose_text=**-** The ghost now deals magical damage, which ignores the armor of enemies\n**-** The ghost can now wear cursed equipment, and you can take it back from them at any time
ui.changelist.orange_v1_x_changes.v110_parchment_scrap_2_title=Parchment Scrap
ui.changelist.orange_v1_x_changes.v110_parchment_scrap_2_text=Enchantments and glyphs now appear a little less often than before:\n\n**-** +0: 1.5x as common, down from 2x\n**-** +1: 3x as common, down from 4x\n**-** +2: 5x as common, down from 7x\n**-** +3: 8x as common, down from 10x
ui.changelist.orange_v1_x_changes.v110_earthen_guardian_2_title=Earthen Guardian
ui.changelist.orange_v1_x_changes.v110_earthen_guardian_2_text=The guardian no longer has any evasion, so it can't dodge attacks. It used to have half of your evasion.
ui.changelist.orange_v1_x_changes.v110_dried_rose_2_title=Dried Rose
ui.changelist.orange_v1_x_changes.v110_dried_rose_2_text=The ghost is a spirit, so it can no longer be:\n\n**-** Healed by the Wand of Transfusion, it shields them instead\n**-** Healed by potions or bombs thrown at it, including honeyed healing and the regrowth bomb\n\nOther effects that help allies still work.
ui.changelist.orange_v1_x_changes.v10_welcome_to_orange_title=Welcome to Orange!
ui.changelist.orange_v1_x_changes.v10_welcome_to_orange_text=Shattered Pixel Dungeon v4.0.2 is now Orange Pixel Dungeon! This first release has a new title screen, and adds lots of new talents, artifacts and other changes, many of them adapted from Re-ARranged Pixel Dungeon.\n\nThe original changelogs are kept as part of the game's history.
ui.changelist.orange_v1_x_changes.v10_medic_kit_title=Medic Kit
ui.changelist.orange_v1_x_changes.v10_medic_kit_text=The new **Medic Kit** artifact holds charges that recharge over time. It holds 1 charge at +0, up to 10 charges at +9, and each charge restores 10% of max health (12.5% from +5, 15% at +10). Using it takes a turn.\n\n**-** Level 3: healing is applied much faster\n**-** Level 6: excess healing becomes a shield, and you can choose to heal to full or use every charge\n**-** Level 10: healing is instant and takes no time\n**-** Gains a level from each Potion of Healing, a full waterskin or a blessed ankh saving you\n**-** With the Pharmacophobia challenge, the kit can only create shields\n**-** A cursed kit cannot be used, and while it is equipped any healing item (potions of healing, dew, honeyed healing) poisons you for half of the heal amount instead of healing you
ui.changelist.orange_v1_x_changes.v10_artifacts_return_title=Artifacts Return
ui.changelist.orange_v1_x_changes.v10_artifacts_return_text=The **Cape of Thorns** and **Lloyd's Beacon** can now be found as random artifact loot.
ui.changelist.orange_v1_x_changes.v10_universal_tier_3_talents_title=Universal Tier 3 Talents
ui.changelist.orange_v1_x_changes.v10_universal_tier_3_talents_text=Choosing a subclass now also unlocks 4 talents shared by all subclasses:\n**-** Attack Speed Enhancement: +5% attack speed per level (max +4)\n**-** Accuracy Enhancement: +5% accuracy per level (max +4)\n**-** Evasion Enhancement: +5% evasion per level (max +4)\n**-** Better Choice: gives a Stone of Enchantment, Scroll of Enchantment and Scroll of Upgrade
ui.changelist.orange_v1_x_changes.v10_new_tier_1_2_talents_title=New Tier 1 & 2 Talents
ui.changelist.orange_v1_x_changes.v10_new_tier_1_2_talents_text=Every hero gets a new talent in tier 1 and tier 2:\n**Warrior:** Physical Enhancement Training (max health) and Counter Stance (parry)\n**Mage:** Charge Preservation and Electromagnetic Induction (faster wand charging)\n**Rogue:** Emergency Escape and Swift Stride (movement speed)\n**Huntress:** Water Affinity and Hearty Eater\n**Duelist:** Skilled Hands and Power Accumulation\n**Cleric:** Warding Light and Divine Blast (a new spell)
ui.changelist.orange_v1_x_changes.v10_new_subclass_talents_title=New Subclass Talents
ui.changelist.orange_v1_x_changes.v10_new_subclass_talents_text=Every subclass gets 3 new tier 3 talents:\n**Berserker:** Lethal Rage, Rage Burst, Endurance in Fury\n**Gladiator:** Light Weapons, Offensive Defense, Repeated Finishers\n**Battlemage:** Combat Magic (Magic Combo finishers), Spell Rush, Magic Circle\n**Warlock:** Dark Magic Madness, Enhanced Mark, Mark of Weakness\n**Assassin:** Energy Retrieval, Perfect Assassin, Prudent Preparation\n**Freerunner:** Quick Preparation, Overcoming Adversity, Momentary Focus\n**Sniper:** Kick, Sharpshooting, Target Acquisition\n**Warden:** Living Grass, Attraction, Healing Dew\n**Champion:** Faster Charging, Quick Follow-up, Dual Swords Mastery\n**Monk:** Energy Restoration, Energy Barrier, Harmony\n**Priest:** Divine Ray, Holy Bomb, Resurrection (new spells)\n**Paladin:** Holy Mantle, Power of Life, Aggression Induction (new spells)
ui.changelist.orange_v1_x_changes.v10_interface_title=Interface
ui.changelist.orange_v1_x_changes.v10_interface_text=**-** The tier 3 talent screen now uses two rows when a hero has many talents\n**-** The title screen artwork has been redrawn in orange, and the game is now named Orange Pixel Dungeon
ui.changelist.orange_v1_x_changes.v10_blessed_ankh_title=Blessed Ankh
ui.changelist.orange_v1_x_changes.v10_blessed_ankh_text=**-** Invulnerability after being revived is 1 turn longer\n**-** Revival health is unchanged, but the hero now also gains a shield equal to 50% of their max health\n**-** A Medic Kit in your inventory gains a level when a blessed ankh saves you
ui.changelist.orange_v1_x_changes.v10_sad_ghost_title=Sad Ghost
ui.changelist.orange_v1_x_changes.v10_sad_ghost_text=The reward for the Sad Ghost's quest is now guaranteed to be at least +1. It is +1 80% of the time, +2 15% of the time and +3 5% of the time.
