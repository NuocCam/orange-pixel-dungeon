ui.updatenotification$wndupdate.desc=Orange Pixel Dungeon thường xuyên được cập nhật để chỉnh sửa các nội dung hiện có trong trò chơi, hoặc thêm nội dung hoàn toàn mới!\n\nTrò chơi cũng thường xuyên cải thiện và cân bằng lại trong các bản cập nhật, để các vật phẩm/người hùng/kẻ thù nhất định không quá mạnh hoặc quá yếu.\n\nCác bản cập nhật cũng bao gồm sửa lỗi và các cải tiến về sự ổn định khác nhau.
ui.updatenotification$wndupdate.button=Đi tới trang cập nhật

###orange pixel dungeon
ui.changelist.orange_v1_x_changes.v121_masterwork_title=Kiệt tác
ui.changelist.orange_v1_x_changes.v121_masterwork_text=Thợ rèn troll giờ có thể tôi luyện lại một món vũ khí hoặc bộ giáp với 3000 điểm.
ui.changelist.orange_v1_x_changes.v121_skull_chalice_title=Chén sọ
ui.changelist.orange_v1_x_changes.v121_skull_chalice_text=Một phụ kiện mới. Có thứ gì đó đang đi tìm kẻ uống từ nó.
ui.changelist.orange_v1_x_changes.v121_magic_wells_title=Giếng phép thuật
ui.changelist.orange_v1_x_changes.v121_magic_wells_text=2 giếng phép thuật mới: điện năng và phù phép.
ui.changelist.orange_v1_x_changes.v121_ring_of_wealth_title=Nhẫn giàu sang
ui.changelist.orange_v1_x_changes.v121_ring_of_wealth_text=Nhẫn giàu sang giờ có giới hạn đồ thưởng mỗi tầng, và trang bị từ nó tối đa +4 (hoàng ngọc thăng hoa cũng vậy).
ui.changelist.orange_v1_x_changes.v121_spellbook_title=Sách phép hỗn loạn
ui.changelist.orange_v1_x_changes.v121_spellbook_text=Sách phép hỗn loạn giờ cho bạn chọn 1 trong 2 cuộn giấy, và cuộn nào còn thiếu cũng nâng cấp được :p
ui.changelist.orange_v1_x_changes.v121_crossbow_title=Nỏ
ui.changelist.orange_v1_x_changes.v121_crossbow_text=Phi tiêu bắn từ nỏ đã nâng cấp có sát thương tối đa thấp hơn một chút.
ui.changelist.orange_v1_x_changes.v121_runic_blade_title=Kiếm rune
ui.changelist.orange_v1_x_changes.v121_runic_blade_text=Kỹ năng kiếm rune của kiếm sĩ tăng chậm hơn một chút khi nâng cấp.
ui.changelist.orange_v1_x_changes.v121_well_of_awareness_title=Giếng nhận thức
ui.changelist.orange_v1_x_changes.v121_well_of_awareness_text=Giếng nhận thức không còn hiện vật phẩm trên tầng, nhưng có thể thẩm định vật phẩm trong túi đồ của bạn.
ui.changelist.orange_v1_x_changes.v121_bugfixes_text=Đã sửa các lỗi sau:\n**-** Ijiraq đang cải trang có thể giẫm nát cỏ trong khi thứ nó giả dạng thì không
ui.changelist.orange_v1_x_changes.v120_developer_commentary_title=Lời nhà phát triển
ui.changelist.orange_v1_x_changes.v120_developer_commentary_text=Mình lúc nào cũng muốn có nhiều kiểu tầng hơn và nhiều vật phẩm để nghịch hơn, đây là một bản cập nhật lớn nên có thể còn những lỗi mà mình chưa biết
ui.changelist.orange_v1_x_changes.v120_jungle_floors_title=Tầng rừng rậm
ui.changelist.orange_v1_x_changes.v120_jungle_floors_text=Các tầng rừng rậm, lựa chọn thay thế cho cống ngầm.
ui.changelist.orange_v1_x_changes.v120_monsters_quests_title=Quái vật & Nhiệm vụ
ui.changelist.orange_v1_x_changes.v120_monsters_quests_text=Quái vật và nhiệm vụ mới.
ui.changelist.orange_v1_x_changes.v120_amalgam_title=Amalgam
ui.changelist.orange_v1_x_changes.v120_amalgam_text=Amalgam, một con trùm mới cho tầng 5.
ui.changelist.orange_v1_x_changes.v120_puzzle_rooms_badges_title=Phòng giải đố & Huy chương
ui.changelist.orange_v1_x_changes.v120_puzzle_rooms_badges_text=Các phòng giải đố mới và 7 huy chương mới.
ui.changelist.orange_v1_x_changes.v120_new_consumables_title=Vật phẩm tiêu hao mới
ui.changelist.orange_v1_x_changes.v120_new_consumables_text=Các vật phẩm tiêu hao mới.
ui.changelist.orange_v1_x_changes.v120_magic_orange_title=Cam phép thuật
ui.changelist.orange_v1_x_changes.v120_magic_orange_text=Một món ăn vặt hiếm giúp hồi một ít sinh lực.
ui.changelist.orange_v1_x_changes.v120_ijiraq_title=Ijiraq
ui.changelist.orange_v1_x_changes.v120_ijiraq_text=Một kẻ biến hình mắt đỏ. Hãy cẩn thận!
ui.changelist.orange_v1_x_changes.v120_cape_of_thorns_title=Tấm áo choàng gai nhọn
ui.changelist.orange_v1_x_changes.v120_cape_of_thorns_text=Tấm áo choàng gai nhọn giờ sẽ chờ đến khi bạn sử dụng nó, và lên cấp dễ hơn.
ui.changelist.orange_v1_x_changes.v120_ghost_lore_title=Cốt truyện hồn ma
ui.changelist.orange_v1_x_changes.v120_ghost_lore_text=Đã thay đổi cốt truyện của hồn ma.
ui.changelist.orange_v1_x_changes.v120_medic_kit_title=Hộp cứu thương
ui.changelist.orange_v1_x_changes.v120_medic_kit_text=Hộp cứu thương giờ mặc định mở băng thuốc khi bạn thêm thuốc hồi phục vào, nếu bạn có nó.
ui.changelist.orange_v1_x_changes.v120_ijiraq_drops_title=Đồ rơi của Ijiraq
ui.changelist.orange_v1_x_changes.v120_ijiraq_drops_text=Đã thêm đồ rơi cho Ijiraq.
ui.changelist.orange_v1_x_changes.v120_bugfixes_text=Đã sửa các lỗi sau:\n**-** Hoàng ngọc thăng hoa nhận từ cuộn giấy biến đổi bị yếu cho đến khi được đổi lại\n**-** Hoàng ngọc thăng hoa che mất chiếc nhẫn cùng loại của dạng tâm hồn\n**-** Thay đổi của bản cập nhật hiển thị nhầm trong mục của phần khác\n**-** Sửa mô tả của hoàng ngọc thăng hoa hiển thị sai số
ui.changelist.orange_v1_x_changes.v112_ascendant_citrine_title=Hoàng ngọc thăng hoa
ui.changelist.orange_v1_x_changes.v112_ascendant_citrine_text=Cổ vật mới **hoàng ngọc thăng hoa** mang tiếng vọng của một chiếc nhẫn ngẫu nhiên, với một phần ba sức mạnh của nó. Nhẫn lực đánh không nằm trong số đó.\n\n**-** Nó chỉ nạp năng lượng khi bạn lên cấp. Nhẫn năng lượng và áo choàng nhẹ có tác dụng, nạp lại theo thời gian thì không\n**-** Một lần nạp sẽ đổi nó thành một chiếc nhẫn khác, không bao giờ trùng một loại hai lần liên tiếp\n**-** Mỗi lần đổi cũng nâng cấp nó, tối đa +10, và nó tăng sức mạnh như một chiếc nhẫn ở cấp đó\n**-** Cộng dồn với nhẫn cùng loại đang đeo\n**-** Sức mạnh, sát thương vũ khí ném và đồ rơi thêm chỉ tính số điểm nguyên\n**-** Nếu bị nguyền, nó không làm gì cả, và bạn không thể đeo nhẫn khi đang đeo nó
ui.changelist.orange_v1_x_changes.v112_title_screen_icons_title=Màn hình tiêu đề & Biểu tượng
ui.changelist.orange_v1_x_changes.v112_title_screen_icons_text=**-** Các ngọn lửa trên màn hình tiêu đề giờ là những quả cam xoay tròn\n**-** Boss Slain và Game Over cũng dùng màu cam\n**-** Biểu tượng ứng dụng giờ có màu cam trên mọi nền tảng\n**-** Đã sửa màn hình khởi động trên iOS vẫn hiện logo Shattered
ui.changelist.orange_v1_x_changes.v111_bugfixes_text=Đã sửa các lỗi sau:\n**-** Mô tả của hộp cứu thương hiện mã định dạng thô và ghi lỗi vào nhật ký\n**-** Kính viễn vọng bị chưa giám định sau khi kính viễn vọng nứt tự sửa chữa\n**-** Bùa tiên tri hiện thông báo thiếu văn bản khi có một vật phẩm ẩn ở gần
ui.changelist.orange_v1_x_changes.v111_medic_kit_title=Hộp cứu thương
ui.changelist.orange_v1_x_changes.v111_medic_kit_text=**-** Hộp cứu thương giờ hiện số lần nạp kèm mức tối đa, ví dụ 2/5\n**-** Hồi đầy sinh lực giờ chỉ dùng đúng số lần nạp cần thiết, có tính phần thưởng của ống máu, và ở +6 phần hồi phục không dùng đến vẫn trở thành khiên chắn\n**-** Lượng hồi phục từ hộp giờ được ống máu trải đều ra như các nguồn hồi phục khác, kể cả hồi phục tức thì ở +10
ui.changelist.orange_v1_x_changes.v111_beacon_of_returning_title=Đèn hiệu quay về
ui.changelist.orange_v1_x_changes.v111_beacon_of_returning_text=Phép đèn hiệu quay về đã bị loại khỏi thuật giả kim. Vẫn có thể dùng đèn hiệu của Lloyd để đặt điểm quay về.
ui.changelist.orange_v1_x_changes.v110_orange_versions_changelog_title=Phiên bản Orange & Nhật ký thay đổi
ui.changelist.orange_v1_x_changes.v110_orange_versions_changelog_text=Orange Pixel Dungeon giờ có số phiên bản riêng, bắt đầu từ v1.0.\n\nMàn hình này liệt kê mọi thứ Orange thay đổi so với Shattered Pixel Dungeon v4.0.2 gốc, chia thành Mới, Thay đổi, Tăng sức mạnh và Giảm sức mạnh cho từng phiên bản Orange. Nhật ký thay đổi của trò chơi gốc vẫn có thể xem bằng các nút khác bên dưới.
ui.changelist.orange_v1_x_changes.v110_spyglass_title=Kính viễn vọng
ui.changelist.orange_v1_x_changes.v110_spyglass_text=Một phụ kiện mới không thể tìm thấy trong hầm ngục. Đây là thứ mà kính viễn vọng nứt trở thành khi thấu kính của nó được sửa, xem mục kính viễn vọng nứt trong phần Thay đổi.
ui.changelist.orange_v1_x_changes.v110_mossy_clump_title=Cục rêu
ui.changelist.orange_v1_x_changes.v110_mossy_clump_text=Cục rêu đã được làm lại. Nó không còn biến các tầng thành tầng chủ đề cỏ hoặc nước nữa, thay vào đó:\n\n**-** Luôn phủ mỗi tầng bằng các mảng cỏ và cây ngẫu nhiên, một nửa có lợi và một nửa có hại. 4 cây ở +0, và thêm 2 cây mỗi cấp.\n**-** Mỗi khi một cây bị bất kỳ ai giẫm lên, một cây ngẫu nhiên mới sẽ mọc lại ở nơi khác trên tầng, có thể có lợi hoặc có hại.\n**-** Mỗi cây có lợi bị giẫm lên trên một tầng làm cây mọc lại ở đó ít có khả năng có lợi hơn 5%, cho đến khi tất cả đều có hại. Việc này chỉ ảnh hưởng đến tầng đó.\n\nGiá nâng cấp không đổi.
ui.changelist.orange_v1_x_changes.v110_dimensional_sundial_title=Đồng hồ mặt trời đa chiều
ui.changelist.orange_v1_x_changes.v110_dimensional_sundial_text=Đồng hồ mặt trời đa chiều không còn thay đổi tốc độ kẻ thù xuất hiện. Thay vào đó nó thay đổi kẻ thù dựa trên thời gian thực trong ngày:\n\n**-** Ban đêm (8pm-8am): kẻ thù có ít hơn 5-15% sinh lực, nhưng gây thêm 0-10% sát thương\n**-** Ban ngày (8am-8pm): kẻ thù gây ít hơn 5-15% sát thương, nhưng có thêm 0-10% sinh lực\n\nHiệu ứng tăng theo cấp của phụ kiện. Sinh lực được đặt khi kẻ thù xuất hiện, và trùm không bị ảnh hưởng bởi thay đổi sinh lực.
ui.changelist.orange_v1_x_changes.v110_cracked_spyglass_title=Kính viễn vọng nứt
ui.changelist.orange_v1_x_changes.v110_cracked_spyglass_text=Kính viễn vọng nứt giờ ghi nhớ số vật phẩm ẩn của nó mà bạn đã nhặt. Sau 10 vật phẩm, thấu kính được sửa và phụ kiện trở thành **kính viễn vọng**, giữ nguyên cấp và vẫn tạo thêm vật phẩm trên mỗi tầng, nhưng các vật phẩm không còn bị ẩn.
ui.changelist.orange_v1_x_changes.v110_talisman_of_foresight_title=Bùa tiên tri
ui.changelist.orange_v1_x_changes.v110_talisman_of_foresight_text=Bùa giờ cũng cảnh báo bạn khi có một vật phẩm bị kính viễn vọng nứt giấu ở gần, giống như với bẫy ẩn.
ui.changelist.orange_v1_x_changes.v110_about_screen_title=Màn hình giới thiệu
ui.changelist.orange_v1_x_changes.v110_about_screen_text=Màn hình giới thiệu giờ ghi công nhà phát triển của Orange Pixel Dungeon, kèm liên kết đến trang GitHub của họ. Shattered Pixel Dungeon và mọi người liên quan vẫn được ghi công bên dưới.
ui.changelist.orange_v1_x_changes.v110_earthen_guardian_title=Hộ vệ đất
ui.changelist.orange_v1_x_changes.v110_earthen_guardian_text=Hộ vệ do đũa phép đất sống tạo ra cứng cáp hơn:\n\n**-** Giáp tăng 1, thêm 1 nữa cho mỗi 2 cấp đũa phép\n**-** Nhận ít hơn 20% sát thương từ nguồn phép thuật
ui.changelist.orange_v1_x_changes.v110_parchment_scrap_title=Vụn giấy da
ui.changelist.orange_v1_x_changes.v110_parchment_scrap_text=Phù phép vũ khí và ấn giáp bạn sở hữu giờ mạnh hơn 5-15% khi bạn mang vụn giấy da, tùy theo cấp của nó.
ui.changelist.orange_v1_x_changes.v110_dried_rose_title=Hoa hồng khô
ui.changelist.orange_v1_x_changes.v110_dried_rose_text=**-** Hồn ma giờ gây sát thương phép thuật, bỏ qua giáp của kẻ thù\n**-** Hồn ma giờ có thể mặc trang bị bị nguyền, và bạn có thể lấy lại chúng bất cứ lúc nào
ui.changelist.orange_v1_x_changes.v110_parchment_scrap_2_title=Vụn giấy da
ui.changelist.orange_v1_x_changes.v110_parchment_scrap_2_text=Phù phép và ấn giờ xuất hiện ít hơn trước một chút:\n\n**-** +0: phổ biến gấp 1.5x, giảm từ 2x\n**-** +1: phổ biến gấp 3x, giảm từ 4x\n**-** +2: phổ biến gấp 5x, giảm từ 7x\n**-** +3: phổ biến gấp 8x, giảm từ 10x
ui.changelist.orange_v1_x_changes.v110_earthen_guardian_2_title=Hộ vệ đất
ui.changelist.orange_v1_x_changes.v110_earthen_guardian_2_text=Hộ vệ không còn khả năng né tránh, nên không thể né đòn tấn công. Trước đây nó có một nửa khả năng né tránh của bạn.
ui.changelist.orange_v1_x_changes.v110_dried_rose_2_title=Hoa hồng khô
ui.changelist.orange_v1_x_changes.v110_dried_rose_2_text=Hồn ma là một linh hồn, nên nó không còn có thể:\n\n**-** Được hồi phục bởi đũa phép chuyển đổi, thay vào đó nó nhận khiên chắn\n**-** Được hồi phục bởi thuốc hoặc bom ném vào nó, kể cả elixir hồi phục ngọt ngào và bom tái sinh trưởng\n\nCác hiệu ứng khác giúp đồng minh vẫn có tác dụng.
ui.changelist.orange_v1_x_changes.v10_welcome_to_orange_title=Chào mừng đến với Orange!
ui.changelist.orange_v1_x_changes.v10_welcome_to_orange_text=Shattered Pixel Dungeon v4.0.2 giờ là Orange Pixel Dungeon! Bản phát hành đầu tiên này có màn hình tiêu đề mới, và thêm nhiều tài năng, cổ vật mới cùng các thay đổi khác, nhiều thứ trong đó được chuyển thể từ Re-ARranged Pixel Dungeon.\n\nCác nhật ký thay đổi gốc được giữ lại như một phần lịch sử của trò chơi.
ui.changelist.orange_v1_x_changes.v10_medic_kit_title=Hộp cứu thương
ui.changelist.orange_v1_x_changes.v10_medic_kit_text=Cổ vật mới **hộp cứu thương** chứa các lần nạp được hồi lại theo thời gian. Nó chứa 1 lần nạp ở +0, tối đa 10 lần nạp ở +9, và mỗi lần nạp hồi 10% sinh lực tối đa (12.5% từ +5, 15% ở +10). Sử dụng nó tốn một lượt.\n\n**-** Cấp 3: hồi phục diễn ra nhanh hơn nhiều\n**-** Cấp 6: phần hồi phục dư trở thành khiên chắn, và bạn có thể chọn hồi đầy sinh lực hoặc dùng hết mọi lần nạp\n**-** Cấp 10: hồi phục tức thì và không tốn thời gian\n**-** Lên một cấp từ mỗi thuốc hồi phục, một túi nước đầy hoặc khi ankh được ban phước cứu bạn\n**-** Với thử thách Chứng sợ thuốc, hộp chỉ có thể tạo khiên chắn\n**-** Hộp bị nguyền không thể sử dụng, và khi đang trang bị nó, mọi vật phẩm hồi phục (thuốc hồi phục, giọt sương, elixir hồi phục ngọt ngào) sẽ đầu độc bạn bằng một nửa lượng hồi phục thay vì hồi phục cho bạn
ui.changelist.orange_v1_x_changes.v10_artifacts_return_title=Cổ vật trở lại
ui.changelist.orange_v1_x_changes.v10_artifacts_return_text=**Tấm áo choàng gai nhọn** và **đèn hiệu của Lloyd** giờ có thể tìm thấy dưới dạng cổ vật ngẫu nhiên.
ui.changelist.orange_v1_x_changes.v10_universal_tier_3_talents_title=Tài năng bậc 3 chung
ui.changelist.orange_v1_x_changes.v10_universal_tier_3_talents_text=Chọn một lớp phụ giờ cũng mở khóa 4 tài năng dùng chung cho mọi lớp phụ:\n**-** Cường hóa tốc độ tấn công: +5% tốc độ đánh mỗi cấp (tối đa +4)\n**-** Cường hóa độ chính xác: +5% độ chính xác mỗi cấp (tối đa +4)\n**-** Cường hóa né tránh: +5% né tránh mỗi cấp (tối đa +4)\n**-** Lựa chọn tốt hơn: cho một hòn đá phù phép, cuộn giấy phù phép và cuộn giấy nâng cấp
ui.changelist.orange_v1_x_changes.v10_new_tier_1_2_talents_title=Tài năng bậc 1 & 2 mới
ui.changelist.orange_v1_x_changes.v10_new_tier_1_2_talents_text=Mỗi người hùng nhận một tài năng mới ở bậc 1 và bậc 2:\n**Chiến binh:** Rèn luyện tăng cường thể chất (sinh lực tối đa) và Thế phản đòn (đỡ đòn)\n**Pháp sư:** Bảo toàn năng lượng và Cảm ứng điện từ (đũa phép nạp nhanh hơn)\n**Kẻ cướp:** Thoát hiểm khẩn cấp và Bước chân nhanh nhẹn (tốc độ di chuyển)\n**Nữ thợ săn:** Thân thiện với nước và Phàm ăn\n**Kiếm sĩ:** Đôi tay khéo léo và Tích lũy sức mạnh\n**Giáo sĩ:** Ánh sáng hộ vệ và Vụ nổ thần thánh (một phép mới)
ui.changelist.orange_v1_x_changes.v10_new_subclass_talents_title=Tài năng lớp phụ mới
ui.changelist.orange_v1_x_changes.v10_new_subclass_talents_text=Mỗi lớp phụ nhận 3 tài năng bậc 3 mới:\n**Kẻ điên cuồng:** Thịnh nộ chết người, Bùng nổ thịnh nộ, Bền bỉ trong cuồng nộ\n**Đấu sĩ:** Vũ khí nhẹ nhàng, Phòng thủ phản công, Lặp lại đòn kết liễu\n**Chiến sư:** Phép thuật chiến đấu (đòn kết liễu của chuỗi phép thuật), Thần tốc phép thuật, Vòng tròn phép thuật\n**Hắc pháp sư:** Cơn điên hắc ám, Cường hóa dấu ấn, Dấu ấn suy yếu\n**Sát thủ:** Thu hồi năng lượng, Sát thủ hoàn hảo, Chuẩn bị cẩn trọng\n**Vận động viên:** Chuẩn bị nhanh chóng, Vượt qua nghịch cảnh, Tập trung chốc lát\n**Xạ thủ:** Cú đá, Thiện xạ, Khoá mục tiêu\n**Hộ vệ:** Cỏ sống, Thu hút, Sương chữa lành\n**Nhà vô dịch:** Hồi năng nhanh hơn, Nối đòn nhanh, Tinh thông song kiếm\n**Nhà sư:** Khôi phục năng lượng, Rào chắn năng lượng, Hài hoà\n**Linh mục:** Tia thần thánh, Bom thánh, Hồi sinh (phép mới)\n**Thánh hiệp sĩ:** Áo choàng thánh, Sức mạnh sự sống, Dẫn dụ thù địch (phép mới)
ui.changelist.orange_v1_x_changes.v10_interface_title=Giao diện
ui.changelist.orange_v1_x_changes.v10_interface_text=**-** Màn hình tài năng bậc 3 giờ dùng hai hàng khi người hùng có nhiều tài năng\n**-** Hình nền màn hình tiêu đề đã được vẽ lại bằng màu cam, và trò chơi giờ có tên Orange Pixel Dungeon
ui.changelist.orange_v1_x_changes.v10_blessed_ankh_title=Ankh được ban phước
ui.changelist.orange_v1_x_changes.v10_blessed_ankh_text=**-** Thời gian bất tử sau khi được hồi sinh dài hơn 1 lượt\n**-** Sinh lực khi hồi sinh không đổi, nhưng người hùng giờ cũng nhận khiên chắn bằng 50% sinh lực tối đa\n**-** Hộp cứu thương trong túi đồ của bạn lên một cấp khi ankh được ban phước cứu bạn
ui.changelist.orange_v1_x_changes.v10_sad_ghost_title=Hồn ma buồn
ui.changelist.orange_v1_x_changes.v10_sad_ghost_text=Phần thưởng cho nhiệm vụ của hồn ma buồn giờ đảm bảo ít nhất là +1. Nó là +1 trong 80% trường hợp, +2 trong 15% và +3 trong 5%.
