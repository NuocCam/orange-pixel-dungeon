ui.customnotebutton.desc=Ghi chú cá nhân cho phép bạn ghi chép bất cứ thứ gì bạn thích vào trong sổ tay.\n\nChúng có thể chỉ là văn bản đứng riêng, hoặc chúng có thể được đặt cho một tầng ngục, một vật phẩm của bạn, hoặc một loại thuốc/cuộn giấy/nhẫn.
